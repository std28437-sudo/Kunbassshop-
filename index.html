<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KunBasshop - หน้าร้านและระบบจัดการสต็อก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchView('store')">
        <div class="w-9 h-9 bg-emerald-600 text-white rounded-lg flex items-center justify-center font-bold text-lg">KB</div>
        <span class="font-bold text-xl tracking-tight text-slate-900">KunBasshop</span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="switchView('store')" id="nav-store" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700">หน้าร้าน</button>
        <button onclick="toggleCart()" class="relative px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center gap-1.5">
          <span>ตะกร้า</span>
          <span id="cart-count" class="bg-emerald-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
        </button>
        <button onclick="switchView('admin')" id="nav-admin" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">แอดมิน</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6">

    <!-- ==================== STOREFRONT VIEW ==================== -->
    <section id="view-store">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">สินค้าทั้งหมด</h1>
          <p class="text-sm text-slate-500">แตะที่สินค้าเพื่อดูรายละเอียดเพิ่มเติม หรือกดใส่ตะกร้าได้ทันที</p>
        </div>
        <div class="flex gap-2">
          <input type="text" id="search-input" oninput="renderProducts()" placeholder="ค้นหาชื่อสินค้า, แบรนด์, SKU..." class="px-3.5 py-2 bg-white border border-slate-300 rounded-lg text-sm w-full sm:w-64 focus:outline-none focus:border-emerald-500" />
          <select id="category-filter" onchange="renderProducts()" class="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
            <option value="">ทุกหมวดหมู่</option>
          </select>
        </div>
      </div>

      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <div class="col-span-full text-center py-12 text-slate-400">กำลังโหลดรายการสินค้า...</div>
      </div>
    </section>

    <!-- ==================== ADMIN VIEW ==================== -->
    <section id="view-admin" class="hidden">
      <!-- Login Form -->
      <div id="admin-login-box" class="max-w-md mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm mt-8">
        <h2 class="text-xl font-bold text-slate-900 mb-1">เข้าสู่ระบบผู้ดูแลร้าน</h2>
        <p class="text-sm text-slate-500 mb-5">กรอกอีเมลและรหัสผ่านแอดมินเพื่อจัดการสต็อกและออเดอร์</p>
        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
            <input type="email" id="admin-email" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500" placeholder="admin@kunbasshop.com" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
            <input type="password" id="admin-password" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500" placeholder="••••••••" />
          </div>
          <p id="login-error" class="text-sm text-red-600 hidden"></p>
          <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm">เข้าสู่ระบบ</button>
        </form>
      </div>

      <!-- Admin Dashboard -->
      <div id="admin-dashboard" class="hidden space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200">
          <div>
            <h2 class="text-lg font-bold text-slate-900">ระบบจัดการร้าน KunBasshop</h2>
            <p id="admin-user-label" class="text-xs text-slate-500"></p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="switchAdminTab('stock')" id="tab-stock" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-emerald-600 text-white">จัดการสินค้า / สต็อก</button>
            <button onclick="switchAdminTab('orders')" id="tab-orders" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-700">รายการสั่งซื้อ</button>
            <button onclick="handleAdminLogout()" class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50">ออกจากระบบ</button>
          </div>
        </div>

        <!-- Tab 1: Stock & Products -->
        <div id="admin-panel-stock" class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-semibold text-slate-800">คลังสินค้าทั้งหมด</h3>
            <button onclick="openAddProductModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-
